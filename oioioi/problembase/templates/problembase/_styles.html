{% load i18n %}
<style>
    .pb-table td { vertical-align: top; }
    .pb-summary { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 60rem; }
    .pb-muted { color: var(--bs-secondary-color); font-size: .875em; }
    .pb-seen { color: var(--bs-danger); font-weight: 600; white-space: nowrap; }
    .pb-rating { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pb-ban select[multiple] { min-height: 10rem; }
    .pb-rejected > td { opacity: .55; }
    .pb-rejected > td:last-child { opacity: 1; }
    .pb-more > summary { list-style: none; cursor: pointer; display: block; }
    .pb-more > summary::-webkit-details-marker { display: none; }
    .pb-more[open] .pb-summary { display: block; -webkit-line-clamp: unset; overflow: visible; }
    .pb-toggle { color: var(--bs-link-color); font-size: .8em; white-space: nowrap; }
    .pb-more > summary .pb-toggle::before { content: "{% trans "more" %}"; }
    .pb-more[open] > summary .pb-toggle::before { content: "{% trans "less" %}"; }
    .pb-label { font-weight: 600; }
    .pb-more-contests > summary { cursor: pointer; color: var(--bs-link-color); }
    .pb-view-switch { font-size: .875em; }
    .pb-rating-input { width: 5.5rem; }
    .pb-tags { font-size: .875em; color: var(--bs-primary-text-emphasis); }
    .pb-text { white-space: pre-line; max-width: 60rem; }
</style>
