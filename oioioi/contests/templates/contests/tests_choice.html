{% extends "base-with-menu.html" %}
{% load i18n %}
{% load pagination_tags %}

{% block title %}{% trans "My submissions" %}{% endblock %}

{% block main-content %}

<h2>{% trans "Rejudge" %}</h2>

<form action="rejudge/" method="POST" class="form-list-unstyled">
    {% csrf_token %}
    {% include "contests/rejudge_options.html" %}
    <div  class="d-none">
        {{ form.submissions }}
    </div>
    <div class="mb-3">
        <input type="submit" class="btn btn-primary"/>
    </div>
</form>

{% endblock %}
